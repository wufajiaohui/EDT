name: tiancheng

on:
  workflow_dispatch:
  schedule:
    # 每天北京時間 08:05, 14:05, 20:05 執行 (UTC 00:05, 06:05, 12:05)
    - cron: '5 0,6,12 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Process and Write Strictly Ordered
        run: |
          mkdir -p tiancheng
          BJ_TIME=$(date -d "+8 hours" "+%m-%d %H:%M:%S")
          TARGET_FILE="tiancheng/all.txt"
          TMP_FINAL="tmp_final.txt"
          TMP_OLD="tmp_old.txt"
          HAS_CHANGES=false
          
          # 清理潛在的舊暫存檔
          rm -f tmp_*.txt

          # 1. 抓取數據
          RAW_FETCH=$(curl -sSL --connect-timeout 15 "https://raw.githubusercontent.com/wanwushequ/cfyxip/main/tiancheng/all.txt" || true)

          if [ -z "$RAW_FETCH" ] || [[ "$RAW_FETCH" == *"404"* ]] || [[ ${#RAW_FETCH} -lt 20 ]]; then
            echo "警告：數據源抓取異常，跳過本次處理。"
            exit 0
          fi

          # 2. 自動判斷 Base64 或明文
          RAW_DATA=""
          if echo "$RAW_FETCH" | tr -d ' \n\r' | base64 -d >/dev/null 2>&1; then
            RAW_DATA=$(echo "$RAW_FETCH" | tr -d ' \n\r' | base64 -d 2>/dev/null || true)
          fi
          if [ -z "$RAW_DATA" ] || [[ "$RAW_DATA" != *":"* ]]; then
            RAW_DATA="$RAW_FETCH"
          fi

          # 3. 解析與清洗資料
          while IFS= read -r line || [ -n "$line" ]; do
            line=$(echo "$line" | tr -d '\r')
            [[ -z "$line" ]] && continue
            
            # 剔除頭尾標籤與廣告宣傳行
            if [[ "$line" == *"▼"* || "$line" == *"▲"* || "$line" == *"全量版"* || "$line" == *"BestCF"* || "$line" == *"免费"* ]]; then
              continue
            fi
            
            # 提取 IP:Port
            hp=""
            if [[ "$line" == *"@"* ]]; then
              hp=$(echo "$line" | sed -n 's/.*@\([^?#]*\).*/\1/p' | head -n1)
            else
              hp=$(echo "$line" | cut -d'#' -f1 | tr -d ' ')
            fi

            # 【關鍵】只允許 443 或 8443 端口
            if [[ "$hp" == *:443 || "$hp" == *:8443 ]]; then
              name_part=$(echo "$line" | cut -d'#' -f2-)
              
              # 【關鍵】只分類 JP, SG, HK, US, TW 五個地區，其他地區(如 KR, OT)直接忽略
              if [[ "$name_part" == *"JP"* || "$name_part" == *"日本"* ]]; then 
                echo "${hp}#JP | ${hp}" >> tmp_JP.txt
              elif [[ "$name_part" == *"SG"* || "$name_part" == *"新加坡"* || "$name_part" == *"印加坡"* ]]; then 
                echo "${hp}#SG | ${hp}" >> tmp_SG.txt
              elif [[ "$name_part" == *"HK"* || "$name_part" == *"香港"* || "$name_part" == *"港岛"* ]]; then 
                echo "${hp}#HK | ${hp}" >> tmp_HK.txt
              elif [[ "$name_part" == *"US"* || "$name_part" == *"美國"* || "$name_part" == *"美国"* || "$name_part" == *"战争贩子"* ]]; then 
                echo "${hp}#US | ${hp}" >> tmp_US.txt
              elif [[ "$name_part" == *"TW"* || "$name_part" == *"台灣"* || "$name_part" == *"台湾"* || "$name_part" == *"宝岛"* ]]; then 
                echo "${hp}#TW | ${hp}" >> tmp_TW.txt
              fi
            fi
          done <<< "$RAW_DATA"

          # 4. 檢查是否有生成任何目標地區暫存檔
          count=$(ls tmp_*.txt 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "saas.sin.fan:443#▼ 優選IP | $BJ_TIME | Cloudflare EDT" > "$TMP_FINAL"
            
            # 嚴格順序：JP, SG, HK, US, TW
            for reg in JP SG HK US TW; do
              if [ -s "tmp_${reg}.txt" ]; then
                sort -u "tmp_${reg}.txt" >> "$TMP_FINAL"
              fi
            done
            
            echo "bestcf.030101.xyz:443#▲ 優選IP | Cloudflare EDT | 感謝天誠" >> "$TMP_FINAL"
            
            # 比對是否有實際資料變動 (排除首尾時間戳)
            if [ -f "$TARGET_FILE" ]; then
              sed '1d;$d' "$TARGET_FILE" > "$TMP_OLD" 2>/dev/null || true
              sed '1d;$d' "$TMP_FINAL" > tmp_new_check.txt 2>/dev/null || true
              if ! diff -q "$TMP_OLD" tmp_new_check.txt >/dev/null 2>&1; then
                HAS_CHANGES=true
              else
                echo "資料內容無實質變動，無需更新檔案。"
              fi
            else
              HAS_CHANGES=true
            fi

            if [ "$HAS_CHANGES" = true ]; then
              cp "$TMP_FINAL" "$TARGET_FILE"
            fi
          else
            echo "警告：未獲取到有效的 JP/SG/HK/US/TW (443/8443) 節點，跳過寫入。"
          fi

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          if [ "${{ env.has_changes }}" = "true" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add tiancheng/all.txt
            
            git commit -m "TianCheng Update $(date -d "+8 hours" '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin main
          else
            echo "無變更或未獲取到有效數據，跳過提交。"
          fi
