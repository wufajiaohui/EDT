name: vvhan

on:
  workflow_dispatch:
  schedule:
    # 每 2 小時執行一次 (00:00, 02:00, 04:00...)
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Fetch and Process Data
        run: |
          # 創建目標文件夾 vvhan
          mkdir -p vvhan
          
          # 設定北京時間
          BJ_TIME=$(date -d "+8 hours" "+%m-%d %H:%M")
          TARGET_FILE="vvhan/ipv4.txt"
          TMP_NEW="new_processed.tmp"
          TMP_OLD="old_processed.tmp"
          HAS_CHANGES=false

          # 1. 抓取原始數據
          RAW_DATA=$(curl -sSL --connect-timeout 15 "https://raw.githubusercontent.com/cdngogo/CFIP/main/full_ips.txt")

          # 【安全檢查】檢查抓取內容是否有效
          if [[ "$RAW_DATA" == *"404"* ]] || [[ ${#RAW_DATA} -lt 30 ]]; then
            echo "警告：數據源抓取異常，跳過本次更新。"
            exit 0
          fi

          # 2. 數據清洗與重組
          echo "$RAW_DATA" | grep -E "([0-9]{1,3}\.){3}[0-9]{1,3}" > raw_ipv4.tmp
          > "$TMP_NEW"

          echo "=== 開始處理地區節點 (僅限 443 / 8443 端口) ==="
          # 定義需要抓取的地區與嚴格順序 (JP -> SG -> HK -> US -> TW -> KR)
          for region in "JP" "SG" "HK" "US" "TW" "KR"; do
            count=0
            while read -r line; do
              [ -z "$line" ] && continue
              clean_line=$(echo "$line" | tr -d '\r')
              ip_port=$(echo "$clean_line" | cut -d'#' -f1 | tr -d ' ')
              
              # 嚴格過濾：只抓取 443 或 8443 端口
              if [[ "$ip_port" == *:443 || "$ip_port" == *:8443 ]]; then
                echo "$clean_line | $ip_port" >> "$TMP_NEW"
                count=$((count + 1))
              fi
            done < <(grep -i "$region" raw_ipv4.tmp || true)
            
            echo "地區 [$region] 成功匹配到 $count 個有效 443/8443 節點"
          done

          total_count=$(wc -l < "$TMP_NEW")
          echo "本次總共抓取到 $total_count 個符合條件的節點"

          # 3. 內容對比 (排除標題行與頁尾行)
          should_write=false
          if [ -s "$TMP_NEW" ]; then
            if [ -f "$TARGET_FILE" ]; then
              sed '1d;$d' "$TARGET_FILE" > "$TMP_OLD" 2>/dev/null || true
              if ! diff -q "$TMP_OLD" "$TMP_NEW" > /dev/null 2>&1; then
                should_write=true
                echo "檢查結果：數據有更新，準備寫入。"
              else
                echo "檢查結果：數據與倉庫現有檔案完全一致，無需重新提交。"
              fi
            else
              should_write=true
              echo "檢查結果：目標檔案不存在，將建立新檔案。"
            fi
          else
            echo "警告：未發現任何符合條件的節點，略過本次更新。"
          fi

          # 4. 寫入文件 (自定義封裝標題與頁尾)
          if [ "$should_write" = true ]; then
            echo "saas.sin.fan:443#▼ 優選IPv4 (JP/SG/HK/US/TW/KR) | $BJ_TIME | Cloudflare" > "$TARGET_FILE"
            cat "$TMP_NEW" >> "$TARGET_FILE"
            echo "bestcf.030101.xyz:443#▲ 優選IPv4 (JP/SG/HK/US/TW/KR) | 感謝cdngogo" >> "$TARGET_FILE"
            HAS_CHANGES=true
          fi

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          if [ "${{ env.has_changes }}" = "true" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add vvhan/ipv4.txt
            git commit -m "Update JP/SG/HK/US/TW/KR IPs $(date -d "+8 hours" '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin main
            echo "成功更新並推送到倉庫！"
          else
            echo "數據無變動，跳過 Commit 與 Push。"
          fi
