name: vvhan

on:
  workflow_dispatch:
  schedule:
    # 每 2 小時執行一次 (00:00, 02:00, 04:00...)
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Fetch and Process Data
        run: |
          mkdir -p vvhan
          
          TARGET_FILE="vvhan/ipv4.txt"
          TMP_RAW="raw_data.tmp"
          TMP_NEW="new_processed.tmp"
          TMP_OLD="old_processed.tmp"
          BJ_TIME=$(date -d "+8 hours" "+%m-%d %H:%M")
          
          # 1. 抓取數據 (使用 curl -o 直接存檔，加 User-Agent 防封鎖)
          echo "=== 1. 開始抓取數據源 ==="
          curl -sSL -A "Mozilla/5.0" --connect-timeout 15 "https://raw.githubusercontent.com/cdngogo/CFIP/main/full_ips.txt" -o "$TMP_RAW" || true

          if [ ! -s "$TMP_RAW" ] || grep -q "404: Not Found" "$TMP_RAW"; then
            echo "::error::數據源抓取失敗或返回內容為空！"
            exit 1
          fi

          echo "數據源下載成功，大小: $(wc -c < "$TMP_RAW") 位元組"

          # 2. 數據清洗與重組
          echo "=== 2. 開始解析地區與篩選 443/8443 端口 ==="
          > "$TMP_NEW"

          # 嚴格按順序處理：JP -> SG -> HK -> US -> TW -> KR
          for reg in JP SG HK US TW KR; do
            count=0
            
            # 精準尋找標籤含有該地區代碼的行 (#.*JP)
            while read -r line; do
              [ -z "$line" ] && continue
              clean_line=$(echo "$line" | tr -d '\r')
              ip_port=$(echo "$clean_line" | cut -d'#' -f1 | tr -d ' ')
              
              # 正則驗證：必須是標準 IPv4 且端口僅限 443 或 8443
              if [[ "$ip_port" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}:(443|8443)$ ]]; then
                echo "${clean_line} | ${ip_port}" >> "$TMP_NEW"
                count=$((count + 1))
              fi
            done < <(grep -i "#.*$reg" "$TMP_RAW" || true)
            
            echo "地區 [$reg] -> 匹配到 $count 個符合條件的節點"
          done

          TOTAL_COUNT=$(wc -l < "$TMP_NEW")
          echo "=== 篩選完成，共取得 $TOTAL_COUNT 個有效節點 ==="

          if [ "$TOTAL_COUNT" -eq 0 ]; then
            echo "::error::未找到任何符合 443/8443 端口的 JP/SG/HK/US/TW/KR 節點！"
            exit 1
          fi

          # 3. 比對數據是否有實質變動 (剔除首尾標頭時間戳)
          HAS_CHANGES=false
          if [ -f "$TARGET_FILE" ]; then
            sed '1d;$d' "$TARGET_FILE" > "$TMP_OLD" 2>/dev/null || true
            if ! diff -q "$TMP_OLD" "$TMP_NEW" >/dev/null 2>&1; then
              HAS_CHANGES=true
            else
              echo "提示：抓取結果與現有檔案內容完全一致，無需更新。"
            fi
          else
            HAS_CHANGES=true
          fi

          # 4. 寫入目標檔案
          if [ "$HAS_CHANGES" = true ]; then
            echo "saas.sin.fan:443#▼ 優選IPv4 (JP/SG/HK/US/TW/KR) | $BJ_TIME | Cloudflare" > "$TARGET_FILE"
            cat "$TMP_NEW" >> "$TARGET_FILE"
            echo "bestcf.030101.xyz:443#▲ 優選IPv4 (JP/SG/HK/US/TW/KR) | 感謝cdngogo" >> "$TARGET_FILE"
            echo "成功更新 $TARGET_FILE"
          fi

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          if [ "${{ env.has_changes }}" = "true" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add vvhan/ipv4.txt
            git commit -m "Update JP/SG/HK/US/TW/KR IPs $(date -d "+8 hours" '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin main
            echo "成功提交並推送到 GitHub 倉庫！"
          else
            echo "無變更，跳過 Git 提交。"
          fi
